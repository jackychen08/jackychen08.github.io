# Education for the homepage, newest first. The column is hidden while empty.
#   org:    institution name          logo: optional 18px badge image
#   orgs:   instead of org/logo, a list of {name, logo} for joint programs
#   detail: optional small line (department, program)
#   role:   degree, shown with the dates right-aligned
#   dates:  e.g. "Sep. 2024 - Present"
- orgs:
    - name: Carnegie Mellon University
      logo: /assets/img/logos/cmu.png
    - name: University of Pittsburgh
      logo: /assets/img/logos/pitt.png
  detail: Joint Ph.D. Program in Computational Biology
  role: Ph.D.
  dates: Sep. 2024 - Present
